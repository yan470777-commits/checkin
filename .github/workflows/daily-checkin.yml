name: 每日自动签到

on:
  schedule:
    # UTC 17:00 = 北京时间次日 01:00
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可留空，手机上手动触发时随便写）'
        required: false
        default: '手动触发'

permissions:
  contents: write

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 签到 + 生成手机端数据
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查配置
        env:
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
        run: |
          if [ -z "$NEWAPI_ACCOUNTS" ] && [ -z "$CONFIG_URL" ]; then
            echo "::error::没有配置账号：请到 Settings → Secrets and variables → Actions 新建 NEWAPI_ACCOUNTS（内容为 .env 里那段 JSON）"
            exit 1
          fi

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

      - name: 执行签到
        env:
          TZ: Asia/Shanghai
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          NOTIFY_ONLY_FAILURE: ${{ vars.NOTIFY_ONLY_FAILURE }}
          CHECKIN_JSON_OUT: logs/checkin_result.json
        run: |
          mkdir -p logs
          set -o pipefail
          # xvfb：Turnstile 站点需要真实 Chrome 窗口，无显示器时必须挂在虚拟屏上
          xvfb-run -a python -u checkin.py 2>&1 | tee "logs/checkin_$(TZ=Asia/Shanghai date +%Y%m%d).log"
          echo "checkin_exit=$?" | tee -a "logs/checkin_$(TZ=Asia/Shanghai date +%Y%m%d).log"
        continue-on-error: true

      - name: 生成手机端状态数据
        if: always()
        env:
          TZ: Asia/Shanghai
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          CHECKIN_JSON_OUT: logs/checkin_result.json
        run: |
          xvfb-run -a python -u publish_status.py --checkin-json logs/checkin_result.json

      - name: 提交状态数据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git commit -m "更新签到状态 $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "推送失败，第 $i 次重试…"
            sleep 5
          done

      - name: 保存运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
